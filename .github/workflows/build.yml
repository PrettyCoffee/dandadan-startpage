name: Build / Validate / Release

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch: # Allows to run this workflow manually

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@v3.0.0
        with:
          version: 11.28.0
          runtime: node@24.21.0
          install: true
          require-lockfile: true

      - name: Build project
        run: pnpm run build

      - name: Lint code
        run: pnpm run lint

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: ./src/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
